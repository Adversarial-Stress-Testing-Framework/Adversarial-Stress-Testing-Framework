name: cicids2017
description: CICIDS2017 / CICFlowMeter flow features, 78 columns. DRAFT - generated from the published
  schema and not yet validated against the released CSVs. Column names in those files carry leading spaces;
  strip them before loading. Several columns (Bwd PSH Flags, the Bulk features) are constant zero in practice
  and will be dropped by clean_data.
