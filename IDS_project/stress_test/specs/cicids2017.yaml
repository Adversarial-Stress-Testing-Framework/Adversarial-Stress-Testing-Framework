name: cicids2017
description: 'CICIDS2017 / CICFlowMeter flow features, 78 columns. Validated against the released CSVs: all 78 columns
  present, none undeclared. Column names in those files carry leading spaces; the loader strips them. Eight columns
  (Bwd PSH/URG Flags, the six Bulk features) are constant zero and dropped by clean_data. The 14 computed formulas
  were each checked against real flows and reproduce the published column; Packet Length Mean, Average Packet Size,
  Down/Up Ratio and Fwd IAT Total were checked and rejected, so they remain derived.'
features:
  Destination Port:
    role: immutable
    integer: true
  Flow Duration:
    role: increase_only
  Total Fwd Packets:
    role: increase_only
    integer: true
  Total Backward Packets:
    role: derived
    integer: true
  Total Length of Fwd Packets:
    role: increase_only
    integer: true
  Total Length of Bwd Packets:
    role: derived
    integer: true
  Fwd Packet Length Max:
    role: increase_only
  Fwd Packet Length Min:
    role: derived
  Fwd Packet Length Mean:
    role: computed
    formula: '{Total Length of Fwd Packets} / {Total Fwd Packets}'
  Fwd Packet Length Std:
    role: derived
  Bwd Packet Length Max:
    role: immutable
  Bwd Packet Length Min:
    role: immutable
  Bwd Packet Length Mean:
    role: computed
    formula: '{Total Length of Bwd Packets} / {Total Backward Packets}'
  Bwd Packet Length Std:
    role: immutable
  Flow Bytes/s:
    role: computed
    formula: ({Total Length of Fwd Packets} + {Total Length of Bwd Packets}) / ({Flow Duration} / 1000000)
  Flow Packets/s:
    role: computed
    formula: ({Total Fwd Packets} + {Total Backward Packets}) / ({Flow Duration} / 1000000)
  Flow IAT Mean:
    role: derived
  Flow IAT Std:
    role: derived
  Flow IAT Max:
    role: derived
  Flow IAT Min:
    role: derived
  Fwd IAT Total:
    role: increase_only
  Fwd IAT Mean:
    role: derived
  Fwd IAT Std:
    role: derived
  Fwd IAT Max:
    role: increase_only
  Fwd IAT Min:
    role: derived
  Bwd IAT Total:
    role: immutable
  Bwd IAT Mean:
    role: immutable
  Bwd IAT Std:
    role: immutable
  Bwd IAT Max:
    role: immutable
  Bwd IAT Min:
    role: immutable
  Fwd PSH Flags:
    role: increase_only
    integer: true
  Bwd PSH Flags:
    role: immutable
    integer: true
  Fwd URG Flags:
    role: increase_only
    integer: true
  Bwd URG Flags:
    role: immutable
    integer: true
  Fwd Header Length:
    role: increase_only
    integer: true
  Bwd Header Length:
    role: immutable
    integer: true
  Fwd Packets/s:
    role: computed
    formula: '{Total Fwd Packets} / ({Flow Duration} / 1000000)'
  Bwd Packets/s:
    role: computed
    formula: '{Total Backward Packets} / ({Flow Duration} / 1000000)'
  Min Packet Length:
    role: derived
  Max Packet Length:
    role: derived
  Packet Length Mean:
    role: derived
  Packet Length Std:
    role: derived
  Packet Length Variance:
    role: computed
    formula: '{Packet Length Std} ** 2'
  FIN Flag Count:
    role: immutable
    integer: true
  SYN Flag Count:
    role: increase_only
    integer: true
  RST Flag Count:
    role: immutable
    integer: true
  PSH Flag Count:
    role: increase_only
    integer: true
  ACK Flag Count:
    role: immutable
    integer: true
  URG Flag Count:
    role: increase_only
    integer: true
  CWE Flag Count:
    role: immutable
    integer: true
  ECE Flag Count:
    role: immutable
    integer: true
  Down/Up Ratio:
    role: derived
  Average Packet Size:
    role: derived
  Avg Fwd Segment Size:
    role: computed
    formula: '{Fwd Packet Length Mean}'
  Avg Bwd Segment Size:
    role: computed
    formula: '{Bwd Packet Length Mean}'
  Fwd Header Length.1:
    role: computed
    formula: '{Fwd Header Length}'
  Fwd Avg Bytes/Bulk:
    role: derived
  Fwd Avg Packets/Bulk:
    role: derived
  Fwd Avg Bulk Rate:
    role: derived
  Bwd Avg Bytes/Bulk:
    role: immutable
  Bwd Avg Packets/Bulk:
    role: immutable
  Bwd Avg Bulk Rate:
    role: immutable
  Subflow Fwd Packets:
    role: computed
    formula: '{Total Fwd Packets}'
  Subflow Fwd Bytes:
    role: computed
    formula: '{Total Length of Fwd Packets}'
  Subflow Bwd Packets:
    role: computed
    formula: '{Total Backward Packets}'
  Subflow Bwd Bytes:
    role: computed
    formula: '{Total Length of Bwd Packets}'
  Init_Win_bytes_forward:
    role: derived
    integer: true
  Init_Win_bytes_backward:
    role: immutable
    integer: true
  act_data_pkt_fwd:
    role: increase_only
    integer: true
  min_seg_size_forward:
    role: immutable
    integer: true
  Active Mean:
    role: derived
  Active Std:
    role: derived
  Active Max:
    role: derived
  Active Min:
    role: derived
  Idle Mean:
    role: derived
  Idle Std:
    role: derived
  Idle Max:
    role: increase_only
  Idle Min:
    role: derived
ordering:
- - Fwd Packet Length Min
  - Fwd Packet Length Mean
  - Fwd Packet Length Max
- - Bwd Packet Length Min
  - Bwd Packet Length Mean
  - Bwd Packet Length Max
- - Min Packet Length
  - Packet Length Mean
  - Max Packet Length
- - Flow IAT Min
  - Flow IAT Mean
  - Flow IAT Max
- - Fwd IAT Min
  - Fwd IAT Mean
  - Fwd IAT Max
- - Bwd IAT Min
  - Bwd IAT Mean
  - Bwd IAT Max
- - Active Min
  - Active Mean
  - Active Max
- - Idle Min
  - Idle Mean
  - Idle Max
